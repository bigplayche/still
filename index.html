<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still — yoga, pilates &amp; mindfulness</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Still">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="yoga, pilates, breathwork, meditation and sleep sounds.">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0EA; --card:#FBFAF7; --ink:#2A2925; --ink2:#6E6A62; --ink3:#A39E94;
  --line:#E4DFD6; --sage:#7F8E77; --sage-soft:#E3E8DE; --clay:#C59A74; --clay-soft:#F1E5D9;
  --far:#C3BBAE; --r:22px;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E9E5DD;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){#app{height:min(900px,calc(100dvh - 40px));margin-top:20px;border-radius:34px;box-shadow:0 30px 80px -30px rgba(40,35,25,.35)}}
#view{flex:1;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 22px 110px}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;background:rgba(251,250,247,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px;z-index:5}
.tabs a{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;font-size:11px;font-weight:500;color:var(--ink3)}
.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--ink);background:var(--sage-soft)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.08;letter-spacing:-.01em;margin:6px 0 4px}
h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:28px 0 12px}
h3{font-family:var(--serif);font-weight:400;font-size:18px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.seg{display:flex;background:#EAE6DE;border-radius:14px;padding:4px;margin-top:16px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--ink);color:#F7F4EE;font-weight:500;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sage{background:var(--sage)}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -22px;padding-left:22px;padding-right:22px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--card);color:var(--ink2)}
.chip.on{background:var(--ink);color:#F7F4EE;border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sage-soft);color:#56634F}
.tag.pilates{background:var(--clay-soft);color:#8C6544}
.tag.meditation{background:#E5E2EE;color:#5E5878}
.tag.mindfulness{background:#E2ECEC;color:#4C6A6A}
.session{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:84px;height:84px;flex:none;border-radius:16px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.session .meta{font-size:12px;color:var(--ink3);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pose{padding:10px;text-align:left;cursor:pointer}
.pose .thumb{width:100%;height:110px;margin-bottom:8px}
.pose b{font-weight:500;font-size:14px;display:block}
.intent{font-family:var(--serif);font-weight:300;font-size:22px;line-height:1.3}
.week{display:flex;justify-content:space-between;margin-top:14px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink3)}
.week i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:block}
.week i.done{background:var(--sage);border-color:var(--sage)}
.week i.today{border:1.5px solid var(--ink)}
.bars{display:flex;gap:14px;margin-top:12px}
.bars div{flex:1;font-size:12px;color:var(--ink2)}
.bars span{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bars span b{display:block;height:100%;background:var(--sage);border-radius:3px}
/* check-in */
.scale{margin:22px 0}
.scale .row{margin-bottom:10px}
.dots{display:flex;gap:8px}
.dots button{flex:1;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink2);transition:.2s}
.dots button.on{background:var(--ink);color:#F7F4EE;border-color:var(--ink)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px;resize:vertical;outline:none}
textarea:focus,input:focus{border-color:var(--sage)}
.hist{display:grid;grid-template-columns:52px repeat(14,1fr);gap:4px;align-items:center;font-size:11px;color:var(--ink3)}
.hist i{aspect-ratio:1;border-radius:50%;background:var(--line);display:block}
/* coach */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:#F7F4EE;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg img{max-width:160px;border-radius:12px;display:block;margin-bottom:6px}
.composer{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;z-index:4}
.composer .box{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 4px 4px 14px}
.composer input[type=text]{flex:1;border:0;background:none;outline:none;padding:9px 0;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.send{background:var(--ink);color:#F7F4EE}
.preview{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:8px;margin-top:8px}
.preview img{width:40px;height:40px;object-fit:cover;border-radius:8px}
/* overlays */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.overlay.open{transform:none}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.ov-body{flex:1;overflow-y:auto;padding:0 22px 30px}
.stage{position:relative;height:290px;border-radius:28px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;margin-top:8px}
.stage svg.fig{width:100%;height:100%}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#DDE5D6,#A9B8A0 70%);opacity:.55;transition:transform 1s linear}
.orb.big{width:180px;height:180px;opacity:.9}
.orb-label{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.progress{height:3px;background:var(--line);border-radius:2px;margin:18px 0 0;overflow:hidden}
.progress b{display:block;height:100%;background:var(--ink);width:0;transition:width .25s linear}
.timer{font-family:var(--serif);font-weight:300;font-size:46px;letter-spacing:-.02em}
.controls{display:flex;justify-content:center;align-items:center;gap:22px;margin:14px 0 6px}
.controls .icon-btn{width:48px;height:48px;border:1px solid var(--line)}
.controls .play{width:68px;height:68px;background:var(--ink);color:#F7F4EE;border:0}
.controls .play svg{width:26px;height:26px}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--ink3)}
.steps i.cur{background:var(--ink)}
details{border-top:1px solid var(--line);padding:14px 0}
details summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--ink3)}
details[open] summary::after{content:"–"}
details ul{margin:10px 0 0 18px;color:var(--ink2);font-size:14px}
details li{margin-bottom:4px}
.video{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;margin-top:8px}
.video .play-dot{width:44px;height:44px;border-radius:12px;background:var(--clay-soft);display:grid;place-items:center;flex:none}
.video .play-dot svg{width:18px;height:18px;fill:#8C6544}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{color:var(--ink3)}
/* daily + progress */
.tabs a{font-size:10.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal span{font-size:10px;color:var(--ink3);text-align:center}
.cal i{aspect-ratio:1;border-radius:9px;background:#EDE9E2;display:block}
.cal i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.exlist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.exlist span{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.feel{display:flex;gap:8px;margin-top:10px}
.feel button{flex:1;padding:11px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--ink2)}
.feel button.on{background:var(--ink);color:#F7F4EE;border-color:var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-of-type{border-top:0}
.hrow small{display:block;color:var(--ink3);font-size:12px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.meter b{display:block;height:100%;background:var(--clay);border-radius:3px}
.done-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#56634F;background:var(--sage-soft);padding:4px 10px;border-radius:999px}
/* intentions, relief, needs */
.tag.breath{background:#E1E9EF;color:#4A6274}
.intent-card{margin-top:18px;background:linear-gradient(160deg,#FBFAF7,#EEF1EA)}
.quote-by{font-size:13px;color:var(--ink2);margin-top:8px;font-style:italic}
.relief{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.relief button{text-align:left;padding:14px;cursor:pointer}
.relief b{display:block;font-weight:500;font-size:14px}
.relief span{font-size:12px;color:var(--ink2)}
.help{background:#F4EEE6;border-color:#E8DCCB;font-size:13px;color:var(--ink2);margin:6px 0 14px}
.help b{color:var(--ink);font-weight:600}
/* all-lowercase look (what people type stays as typed) */
html,body,body *{text-transform:lowercase!important}
input,textarea,.msg.u{text-transform:none!important}
.eyebrow,.tag,.orb-label{letter-spacing:.04em!important}
.brand{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.02em;color:var(--sage)}
.sound{margin:16px 0 4px}
.sound .chips{margin:8px 0 0;padding:0;flex-wrap:wrap;overflow:visible}
.vol{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink2);margin-top:10px}
.vol input{flex:1;accent-color:var(--sage)}
.sleepbar{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:10px;background:var(--ink);color:#F7F4EE;border-radius:16px;padding:8px 8px 8px 14px;font-size:13px}
.sleepbar[hidden]{display:none}
.sleepbar.high{bottom:calc(140px + env(safe-area-inset-bottom))}
.sleepbar svg{width:18px;height:18px;fill:#F7F4EE;flex:none}
.sleepbar button{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:500}
#app.has-bar #view{padding-bottom:170px}
.sleep-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;background:linear-gradient(160deg,#2F3340,#454B5E);color:#F1EEF7;border-color:#3A3F4E}
.sleep-card .muted{color:#C9C6D6}
.moon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.moon svg{width:26px;height:26px;fill:#E9E4F7}
</style>
</head>

  <main id="view"></main>

<script>
/* ------------------------------------------------------------------

   h head · n neck · m mid-spine · p pelvis · le/lh near elbow/hand
   re/rh far elbow/hand · lk/lf near knee/foot · rk/rf far knee/foot
------------------------------------------------------------------- */

const COW={...QUAD,m:[130,142],h:[183,105]};

const WAR_A={h:[120,57],n:[120,73],m:[120,100],p:[120,128],le:[150,73],lh:[178,73],re:[90,73],rh:[62,73],lk:[158,138],lf:[160,180],rk:[89,154],rf:[58,180]};

const CHILD_B={...CHILD_A,h:[150,158],n:[134,148],m:[108,148],p:[86,158],le:[162,164],re:[160,166]};
const LUNGE_A={h:[123,69],n:[122,85],m:[121,112],p:[120,140],le:[136,110],lh:[154,132],re:[132,112],rh:[150,134],lk:[160,138],lf:[164,180],rk:[80,178],rf:[42,178]};
const LUNGE_B={...LUNGE_A,h:[122,68],le:[127,57],lh:[131,30],re:[124,57],rh:[127,30]};
const BR_A={h:[186,168],n:[170,174],m:[144,176],p:[118,176],le:[145,178],lh:[120,179],re:[143,179],rh:[118,180],lk:[92,140],lf:[104,180],rk:[89,141],rf:[101,180]};
const BR_B={...BR_A,m:[150,160],p:[128,142],lk:[88,134],lf:[100,180],rk:[86,135],rf:[97,180]};
const SLBR_A={...BR_A,lk:[96,132],lf:[60,114]};
const SLBR_B={...BR_B,lk:[90,128],lf:[52,118]};
const HUN_A={h:[164,150],n:[150,160],m:[130,171],p:[110,176],le:[128,165],lh:[104,168],re:[126,167],rh:[102,170],lk:[76,154],lf:[44,132],rk:[78,156],rf:[46,134]};

const LIE_UP={h:[182,169],n:[165,176],m:[140,177],p:[110,177],le:[192,176],lh:[218,176],re:[190,177],rh:[216,178],lk:[70,177],lf:[30,178],rk:[70,178],rf:[30,179]};

/* ------------------------------------------------------------------
   FIGURE ANIMATION
------------------------------------------------------------------- */
const FIGS=new Set();
const ease=x=>(1-Math.cos(Math.PI*x))/2;
function poseAt(frames,dur,t){
  if(frames.length===1) return frames[0];
  const n=frames.length,ph=((t%dur)/dur)*n,i=Math.floor(ph),f=ease(ph-i),a=frames[i],b=frames[(i+1)%n],o={};
  for(const k in a) o[k]=[a[k][0]+(b[k][0]-a[k][0])*f,a[k][1]+(b[k][1]-a[k][1])*f];
  return o;
}
function makeFigure(exId,{stroke=7,paused=false}={}){
  const ex=EX[exId],ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 -24 240 224"); svg.setAttribute("class","fig");
  if(ex.kind==="breath"){ // abstract breathing glyph for thumbnails
    svg.innerHTML=`<circle cx="120" cy="88" r="44" fill="#DDE5D6"/><circle cx="120" cy="88" r="70" fill="none" stroke="#C9D3C1" stroke-width="1.5"/><circle cx="120" cy="88" r="92" fill="none" stroke="#E0E5DA" stroke-width="1"/>`;
    const c=svg.firstChild; const fig={svg,update:t=>{const s=.8+.2*Math.sin(t/1600);c.setAttribute("r",44*s)},t:0,playing:true}; FIGS.add(fig); return fig;
  }
  const pl=(c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg.innerHTML=`<line x1="14" y1="186" x2="226" y2="186" stroke="#E4DFD6" stroke-width="2" stroke-linecap="round"/><ellipse cx="120" cy="187" rx="70" ry="3" fill="#000" opacity=".04"/>`+
    pl("#C3BBAE",stroke)+pl("#C3BBAE",stroke)+pl("#2A2925",stroke+1)+pl("#2A2925",stroke)+pl("#2A2925",stroke)+`<circle r="11" fill="#2A2925"/>`;
  const [fl,fa,sp,nl,na]=svg.querySelectorAll("polyline"),hd=svg.querySelector("circle");
  const P=a=>a.map(p=>p[0].toFixed(1)+","+(p[1]+6).toFixed(1)).join(" ");
  const fig={svg,t:Math.random()*ex.dur,playing:!paused,frames:ex.frames,dur:ex.dur,update(t){
    const q=poseAt(this.frames,this.dur,t);
    fl.setAttribute("points",P([q.p,q.rk,q.rf])); fa.setAttribute("points",P([q.n,q.re,q.rh]));
    sp.setAttribute("points",P([q.n,q.m,q.p])); nl.setAttribute("points",P([q.p,q.lk,q.lf])); na.setAttribute("points",P([q.n,q.le,q.lh]));
    hd.setAttribute("cx",q.h[0]); hd.setAttribute("cy",q.h[1]+6);
  }};
  fig.update(fig.t); FIGS.add(fig); return fig;
}
let last=performance.now();
function loop(now){
  const dt=now-last; last=now;
  FIGS.forEach(f=>{ if(!f.svg.isConnected){FIGS.delete(f);return} if(f.playing){f.t+=dt;f.update(f.t)} });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function mountFig(el,exId,opts){ const f=makeFigure(exId,opts); el.appendChild(f.svg); return f; }

function togglePlay(){
  audio();
  PL.playing=!PL.playing; $("#pp").innerHTML=PL.playing?ICON.pause:ICON.play; if(PL.fig) PL.fig.playing=PL.playing;
  clearInterval(PL.tick);
  const snd=S.sound[soundKey(PL.s)];
  if(PL.playing){ if(!AMB||AMB.type!==snd||(SLEEP&&SLEEP.fading)){ startAmb(snd); armSleep(); } } else stopAmb();
  if(PL.playing){ if(PL.el===0&&PL.i===0) ding(1,.12); PL.lastT=Date.now(); PL.tick=setInterval(()=>{ const n=Date.now(); PL.el+=(n-PL.lastT)/1000; PL.lastT=n; if(PL.el>=PL.steps[PL.i].sec){ go(1,true) } else paintTime(); },200); }
}
function go(d,auto){
  const n=PL.i+d;
  if(n<0) { PL.el=0; return paintTime(); }
  if(n>=PL.steps.length){ return finish(); }
  PL.i=n; PL.el=0; PL.lastT=Date.now(); if(auto) chime(); renderStep();
}
function paintTime(){
  const st=PL.steps[PL.i],e=EX[st.id],left=Math.max(0,Math.ceil(st.sec-PL.el));
  $("#tm").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#pg").style.width=(PL.el/st.sec*100)+"%";
  if(e.script){ let t=e.script[0][1]; e.script.forEach(([at,txt])=>{ if(PL.el>=at) t=txt }); const c=$("#cue"); if(c.textContent!==t){ c.textContent=t; c.classList.remove("fade"); void c.offsetWidth; c.classList.add("fade"); } }
  if(e.pattern){
    const [a,b,c,d]=e.pattern,tot=a+b+c+d,x=PL.el%tot; let lab,sc;
    const LB=e.labels?(Array.isArray(e.labels[0])?e.labels[Math.floor(PL.el/tot)%e.labels.length]:e.labels):["Breathe in","Hold","Breathe out","Hold"];
    if(x<a){lab=LB[0];sc=.6+.4*(x/a)} else if(x<a+b){lab=LB[1];sc=1} else if(x<a+b+c){lab=LB[2];sc=1-.4*((x-a-b)/c)} else {lab=LB[3];sc=.6}
    const cnt=Math.ceil(x<a?a-x:x<a+b?a+b-x:x<a+b+c?a+b+c-x:tot-x);
    $("#orb").style.transform=`scale(${sc})`; $("#ol").textContent=PL.playing?`${lab} · ${cnt}`:"Press play";
  }
}
function finish(){
  clearInterval(PL.tick); if(!SLEEP) stopAmb(); ding(2); const s=PL.s; PL.playing=false;
  const w={id:String(Date.now()),at:Date.now(),date:dkey(),sid:s.id,title:s.daily?`${s.title} (daily)`:s.title,cat:s.cat,min:mins(s),level:S.level,ex:PL.steps.map(x=>x.id),feel:null};
  saveWorkout(w);
  const moving=s.cat==="yoga"||s.cat==="pilates";
  $("#pb").innerHTML=`<div class="fade" style="text-align:center;padding-top:40px"><div class="orb big" style="position:relative;margin:0 auto;transform:scale(.8)"></div>
   <h1 style="margin-top:24px">Well done.</h1><p class="muted">${esc(s.title)} · ${mins(s)} min · ${streak()}-day streak</p>
   ${moving?`<div class="card" style="margin:24px 0 0;text-align:left"><div class="eyebrow">How did that feel?</div><div class="feel" id="feel">${Object.entries(FEEL).map(([k,n])=>`<button data-f="${k}">${n}</button>`).join("")}</div><p class="note" id="feelnote">Your answer tunes the length of your next daily workouts.</p></div>`
     :`<p class="intent" style="margin:28px 8px 6px">Take one breath to notice how you feel now.</p>`}
   <div class="card intent-card" style="margin-top:20px;text-align:left"><div class="eyebrow">Carry this with you</div><p class="intent" style="font-size:19px;margin-top:8px">${esc(todayIntention().t)}</p></div>
   <button class="btn block" id="done" style="margin-top:18px">Close</button>
   <a class="btn ghost block" href="#progress" id="prog" style="margin-top:10px">See your progress</a>
   ${S.checkins[dkey()]?"":`<a class="btn ghost block" href="#checkin" id="ci" style="margin-top:10px">Check in now</a>`}</div>`;
  if($("#feel")) $("#feel").onclick=e=>{const f=e.target.dataset.f;if(!f)return;w.feel=f;saveWorkout(w);$("#feel").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.f===f));$("#feelnote").textContent=`Saved. Daily workout intensity is now ${Math.round(intensity()*100)}%.`};
  $("#done").onclick=()=>{closePlayer();render()}; $("#prog").onclick=()=>closePlayer(); if($("#ci")) $("#ci").onclick=()=>closePlayer();
}

/* ------------------------------------------------------------------
   ROUTER
------------------------------------------------------------------- */
const VIEWS={today:viewToday,practice:viewPractice,checkin:viewCheckin,progress:viewProgress,coach:viewCoach};
function render(){
  const name=(location.hash||"#today").slice(1),fn=VIEWS[name]||viewToday,v=$("#view");
  const keep=v.scrollTop,same=v.dataset.v===name; v.dataset.v=name;
  if(name!=="coach"&&$("#composer")) $("#composer").remove();
  fn(v);
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===(VIEWS[name]?name:"today")));
  if(name!=="coach") v.scrollTop=same?keep:0;
}
window.addEventListener("hashchange",()=>{ if(PL&&location.hash==="#checkin") closePlayer(); render(); });
$("#sbstop").onclick=()=>{stopAmb();refreshSoundUI()};
$("#sbopen").onclick=openSleep;
render(); initCaps();
</script>

if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
// The AI coach only runs inside Claude; send anyone landing on #coach to today.
if(document.documentElement.classList.contains("no-ai")&&location.hash==="#coach")location.hash="today";
</script>
